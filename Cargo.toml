[workspace]
resolver = "2"
members = [
    "crates/overflow-core",
    "crates/overflow-agent",
    "crates/federation-directory",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/Maveth/pool-overflow"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
axum = { version = "0.7", features = ["macros"] }
hex = "0.4"

[profile.release]
lto = false
codegen-units = 16
opt-level = 2
